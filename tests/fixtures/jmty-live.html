<!DOCTYPE html><html><head><title>fixture</title></head><body><script id="__NEXT_DATA__" type="application/json">{"props":{"__N_SSP":true,"pageProps":{"title":"🚨期間限定🚨🏆選び抜かれたアイテム💫📮特別ラッキープライスセール中💝 (エコリッチストア) 川崎の生活家電の中古あげます・譲ります｜ジモティーで不用品の処分","description":"【ジモティー】安いだけじゃない‼️美品家電‼️写真を見てから安心して購入できる‼️売れてしまっていた場合も同等商品をご紹介出来ます😊今回もお得な3点セット… (エコリッチストア) 川崎の生活家電の中古あげます・譲ります｜ジモティーで不用品の処分","keyword":"川崎,中古,あげます,譲ります,無料掲載,無料広告,フリマ,掲示板,ジモティー,フリーマーケット","layout":"pc","isNoIndex":false,"isShowAreaSelect":true,"prefecture":{"id":14,"name":"神奈川","name_en":"kanagawa","name_with_suffix":"神奈川県"},"headerCategoryGroup":{"id":1,"name":"売ります・あげます","shorten_name":"売買","name_en":"sale"},"headerCategory":{"id":3,"name":"家電","name_en":"ele"},"ogImage":"https://cdn.jmty.jp/articles/images/5f4fb47edd411d33efc21fef/slide_0.jpg","isShowBanner":false,"canonical":"https://jmty.jp/kanagawa/sale-ele/article-h8cpm","bannerParams":{"type":"detail","articleTitle":"🚨期間限定🚨🏆選び抜かれたアイテム💫📮特別ラッキープライスセール中💝","articleKey":"5e5ba8afa8f2bb2b0d9e2f73","articleCategoryGroupId":1},"articleResults":{"article":{"id":"5e5ba8afa8f2bb2b0d9e2f73","key":"h8cpm","title":"🚨期間限定🚨🏆選び抜かれたアイテム💫📮特別ラッキープライスセール中💝","text":"安いだけじゃない‼️\r\n美品家電‼️\r\n写真を見てから安心して購入できる‼️\r\n\r\n売れてしまっていた場合も同等商品をご紹介出来ます😊\r\n\r\n今回もお得な3点セットです❣\r\n※写真は参考商品となります\r\n\r\n・大人気東芝の冷蔵庫❕　138L　2015年製\r\n・評判良いアクアの洗濯機❕　5.5㎏　2014年製\r\n・シンプル電子レンジ❕　2016年製\r\n\r\n\r\n⭐️最大2週間まで手配可能‼️\r\n\r\n\r\n-直接引き取り希望の場合-\r\n\r\n直接お引き取り場所\r\n埼玉県所沢市 \r\n詳細地はメッセージにてお送り致します。 \r\n毎週月/木/土 10:00～16:00対応可能ですので、ご希望の引き取り日とお越し頂くだいたいのお時間、氏名お送りお願い致します。\r\n\r\n取り扱い商品\r\n冷蔵庫、洗濯機、電子レンジ・テレビ・コンロ・炊飯器など\r\n\r\n■単品販売\r\n洗濯機 または 冷蔵庫\r\n・2016年製～\r\n・8,000円～\r\n\r\n■セット販売（2点～6点の組み合わせ）\r\n\r\n✅ Aセット（2点）\r\n▶️ 洗濯機＋冷蔵庫\r\n・2016～2020年製\r\n・18,000円～\r\n\r\n✅ Bセット（2点）\r\n▶️ 洗濯機＋冷蔵庫\r\n・2020年製～\r\n・25,000円～\r\n\r\n✅Cセット（3点）\r\n▶️ 洗濯機＋冷蔵庫＋電子レンジ\r\n・2014年製～\r\n・30,000円～\r\n\r\n✅ Dセット（4点）\r\n▶️ 洗濯機＋冷蔵庫＋電子レンジ＋テレビ\r\n・2014年製～\r\n・40,000円～\r\n\r\n✅ Eセット（5点）\r\n▶️ 洗濯機＋冷蔵庫＋電子レンジ＋テレビ＋コンロ\r\n・2014年製～\r\n・45,000円～\r\n💡 ガスコンロは「プロパン」or「都市ガス」お選びいただけます！\r\n\r\n✅ Fセット（6点）\r\n▶️ 洗濯機＋冷蔵庫＋電子レンジ＋テレビ＋コンロ＋炊飯器\r\n・2014年製～\r\n・50,000円～\r\n💡 ガスコンロは「プロパン」or「都市ガス」お選びいただけます！\r\n⚠️最後まで説明欄をお読み下さい⚠\r\n\r\n\r\n\r\n特段動作に不具合はありません⭐️ \r\n商品は簡易清掃になります。 \r\n中古品になりますので、神経質な方は御遠慮下さい。 \r\n\r\n気になる方は洗浄オプションございますので、ご希望の方はお申し付けくださいませ。 \r\n下記詳細記載しておりますのでご確認ください。 \r\n\r\n\r\n\r\nお手頃価格ですので、中古品で構わないから安く欲しいという方には是非😄😍 \r\n\r\nお問い合わせは下記内容を必ず送って下さい。 \r\n\r\n《購入者様フォーマット》 \r\n\r\n◼️氏名 \r\n◼️配送先の住所 \r\n※マンション名、部屋番号の記載漏れにご注意下さい。 \r\n※メゾネットタイプの場合はお任せオプションが必須になります。また大型家電の場合は搬入をお断りする可能性がございます。 \r\n※階段で3階以上の配送には追加料金がかかりますのでご確認お願い致します。 \r\n3階＋¥1,000～2,000円 \r\n4階＋¥2,000～3,000円 \r\n5階＋¥3,000～4,000円 \r\n階段3階以上の配送の方は事前にお伝え頂きますようお願い致します。 \r\n※階段作業の場合は搬入経路の採寸を予めご確認下さい。 \r\n\r\n◼️エレベーターの有無 \r\n\r\n◼️購入希望の商品番号 \r\n※複数ある場合は全て記載して下さい。 \r\n\r\n◼️配送or直接取引 \r\n【配送】 \r\n配送希望の方は下記に希望日時を第3希望まで入力下さい。 \r\n【直接取引】 \r\n埼玉県所沢市 \r\n詳細地はメッセージにてお送り致します。 \r\n毎週月/木/土 10:00～16:00対応可 \r\n\r\n◼️希望日時 \r\n①午前(8～14) \r\n②午後(10～17) \r\n③夜間(15～20) \r\n④終日(8～20) \r\n⑤時間指定 (3時間枠指定)+2,000円\r\n\r\n記入例 \r\n第1希望 6/10 ① \r\n第2希望 6/11 ② \r\n第3希望 6/15 ③ \r\n※当日の配送スケジュール、道路状況により時間が変動致しますので、3時間枠指定以外の方は時間指定出来ませんので、予めご了承下さい。 \r\n\r\n◼️必要オプション番号(必要ない方は無記入で大丈夫です) \r\n\r\n⭐️各種オプション⭐️ \r\n(希望の方は番号を選択して下さい) \r\n\r\n⑴お急ぎ便(3日以内に配送希望の方) \r\n・2,000円 \r\n※配送状況によりますので、場合によってはご利用出来ない可能性もあります。 \r\n\r\n⑵時間指定 \r\n・2,000円 \r\n10:00～22:00こちらの時間帯の中から3時間間隔で指定可能です。 \r\n※配送状況によりますので、場合によってはご利用出来ない可能性もあります。 \r\n\r\n⑶設置作業 \r\n・3,000円(ドラム式のみ5,000円) \r\n女性の方に特に人気のオプションです！\r\n※給排水ホースを切断したり、排水出口を左右に入れ替えたり等、特殊な設置には対応しておりません。万が一長さが足りず設置出来ない場合等は御自身で延長ホース、コードをつなぐなどご対応お願い致します。 \r\n\r\n⑷アルコール除菌＋洗剤洗浄 \r\n・1点につき2,000円(大型冷蔵庫のみ4,000円) \r\n大人気のオプション❗️中古品を安く綺麗に欲しいという方にオススメです。 \r\n※全ての汚れや臭いが取れるわけではありません。 \r\n\r\n⑸業務用洗濯槽セット \r\n・1,500円 \r\n洗濯機を使用前に自分で綺麗にしたいという方にオススメです✨\r\n\r\n⑹高性能防振ゴム \r\n・2,000円(1セット4枚) \r\n洗濯機の音が気になる方必見⭐️\r\n夜間に洗濯機を使われる方や集合住宅にお住いの方にとてもオススメです。床の汚れや傷防止で冷蔵庫にも使えます♫ \r\n\r\n⑺お任せオプション💪\r\n・6,000円 \r\n基本はドライバー1名での配送となりますので搬入の際、お客様にお手伝い頂くことがございます。お手伝いが厳しい方はこちらのオプションをご選択お願い致します。搬入は弊社で全てやらせていただきます。 \r\n\r\n⑻安心の保証プラン(購入日から2週間以内) \r\n・1点につき3,000円 \r\n※大型家電の場合は5,000円になります。 \r\n\r\n購入頂いた商品がお届け日より2週間以内に不要となった場合(動作の不良等も含む)無料で下取り致します。その際、ご希望であれば一度までなら同金額で出品している商品と無償で交換も可能です。中古品のため程度等で \r\n・思っていた商品とは違った \r\n・機能に関して不具合が出てきてしまった \r\n等にも対応出来る安心プランです。 \r\n家電は精密機器ですので運搬時・設置時の僅かな振動や衝撃で稀に不具合が発生してしまう場合もございます。また、当然偶発的な故障が発生する可能性もございます。 \r\n万が一にもそのような事態に備えて、下取り、交換が可能な保障プランに入られることをお勧めしております。 \r\n\r\n※受け渡し時の状態よりも明らかに破損、汚れがひどい場合はお引取り出来ない場合がございます。 \r\n\r\n◼️商品の取り置き期間について\r\n〈取り置き期間〉\r\n・商品の取り置きは最大2週間とし配送の予約が確定した時点で商品の取り置きとなります。\r\n※購入が未確定時点での取り置きは不可となりますのでご注意下さい。\r\n〈再配達の際の取り置き期間〉\r\n・再配達の際は配送日または配送予定日から起算して7日以内に受け取りをお願い致します。期日内に受取が不可な場合は当日キャンセル扱いとなり商品代金及びサービス料金を含め100%のキャンセル料金が発生致しますので予めご了承下さい。\r\n\r\n◼️配送について\r\n〈お客様確認事項〉\r\n・道が狭く建物の付近へトラックが進入できない、大通り沿で車両を止めることが難しい、進入高さ制限のある建物などトラックでの配送が困難な場所へのお届けに関しては必ず事前にご連絡をお願い致します。\r\n・事前に搬入経路の階段、エレベーター、設置場所などの採寸をご確認の上、ご購入をお願い致します。\r\n【ドア・エレベーター等】\r\n商品本体幅＋10㎝が必要となります。\r\n【階段】\r\n商品本体幅＋20㎝が必要となります。\r\nメゾネットタイプの場合は当社で搬入の可否を判断致しますので、必ずお写真を予めお送り下さい。大型家電の場合は搬入をお断りする場合がございます。\r\n万が一当日採寸間違え等により搬入が不可の場合は当日キャンセル扱いとなります。\r\n・特殊な搬入となる場合は現場にて別途特殊作業料金が発生する場合又は搬入をお断りする可能性がございます。予めご了承下さい。\r\n〈配送料金〉\r\n配送料は別途4,000円～9,000円(東京、埼玉、千葉、神奈川内)かかります。\r\n※一部対象外地域有り\r\n配送先、荷物の大きさ、重さ、階段の有無等により変動致します。\r\n※お任せオプションのご利用がない場合は搬入の際にお手伝いをお願い致します。お手伝いが厳しい方は事前にご連絡をお願い致します。お任せオプションを追加の上、当社で全てやらせていただきます。また当日ドライバーの判断によりお客様のお手伝いでは搬入が難しいと判断した場合は搬入ができる所までの作業となります。 予めご了承ください。\r\n〈再配達料金〉\r\n再配達の場合は再配達料金が発生致します。再配達料金は送料と同料金が発生致します。\r\n〈配送時における責任及び免責事項〉\r\n・配達日時の変更\r\n商品のお届けに関しまして、ご指定の配送日にお届けできるように速やかに手配を致しますが、天候、交通状況またはその他の事情によってはお約束の日時に配送が出来ない場合がございます予めご了承ください。 万が一そのような事態が発生した場合はご連絡をさせて頂き、当店負担の上再配達をさせて頂きます。\r\n・免責事項\r\n当社では、次の事由による貨物の滅失、損傷、延着その他の損害については、損害賠償責任を負いません。\r\na.当該貨物の欠陥、自然の消耗、虫害又は鼠害\r\nb.当該貨物の性質による発火、爆発、むれ、かび、腐敗、変色、さびその他これに類似する事由\r\nc.同盟罷業、同盟怠業その他の事変又は強盗\r\nd.不可抗力による火災\r\ne.地震、津波、高潮、大水、暴風雨、地滑り、山崩れ等その他の天災\r\nf.法令又は公権力の発動による運送の差止め、開封、没収、差し押さえ又は第三者への引き渡し\r\ng.荷受け人の故意又は過失\r\nh.当社の定めるお任せオプションをご利用されない場合における運搬時の壁、床、家具家電等の損傷、搬入過程における事故及び怪我等\r\ni. 事前に報告のない瑕疵が存在した場合\r\n・損害賠償の額\r\n万が一当社に過失があった場合(お任せオプション使用時
